services:
  app:
    build: .
    ports:
      - "8084:8084"
    env_file:
      - env/paymentservice.env
    depends_on:
      orderservice:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    container_name: 'paymentservice_kafka'
    image: 'apache/kafka:4.0.0'
    ports:
      - "9092:9092"
    env_file:
      - env/kafka.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  mongodb:
    container_name: 'paymentservice_mongodb'
    image: 'mongodb/mongodb-atlas-local:8.0.0'
    hostname: mongodb
    ports:
      - "27017:27017"
    env_file:
      - env/mongodb.env
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - mongodb_mongot:/data/mongot
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGODB_INITDB_ROOT_USERNAME"
          --password "$$MONGODB_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ping: 1}).ok' | grep 1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  orderservice:
    image: 'ghcr.io/absolute-in-doubt/ordrsvc:latest'
    pull_policy: always
    env_file:
      - env/orderservice.env
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health/readiness || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      postgres-3:
        condition: service_healthy
      authservice:
        condition: service_healthy
      userservice:
        condition: service_healthy

  postgres-3:
    container_name: 'orderservice_postgres'
    image: 'postgres:15'
    env_file:
      - env/postgres.env
    ports:
      - "5435:5432"
    volumes:
      - postgres_data-3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5


  authservice:
    image: 'ghcr.io/absolute-in-doubt/authsvc:latest'
    pull_policy: always
    env_file:
      - env/auth.env
      - env/jwks.env
      - env/client-secrets.env
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      postgres-2:
        condition: service_healthy

  postgres-2:
    container_name: 'authservice_postgres'
    image: 'postgres:15'
    environment:
      - POSTGRES_DB=auth_service_db
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    ports:
      - "5434:5432"
    volumes:
      - postgres_data-2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d auth_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  userservice:
    image: 'ghcr.io/absolute-in-doubt/usrsvc:latest'
    pull_policy: always
    environment:
      - POSTGRES_URL=jdbc:postgresql://userservice_postgres:5432/user_service_db
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWKS_URL=http://authservice:8081/.well-known/jwks.json
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      postgres-1:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres-1:
    container_name: 'userservice_postgres'
    image: 'postgres:15'
    environment:
      - POSTGRES_DB=user_service_db
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    ports:
      - "5433:5432"
    volumes:
      - postgres_data-1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d user_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: 'redis:7.2'
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data-1:
  postgres_data-2:
  postgres_data-3:
  mongodb_data:
  mongodb_config:
  mongodb_mongot:
  kafka_data:
